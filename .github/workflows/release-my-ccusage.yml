name: Release my-ccusage binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-my.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux-x64
            binary: rust/target/release/ccusage
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
            binary: rust/target/release/ccusage
          - runner: macos-15-intel
            asset: macos-x64
            binary: rust/target/release/ccusage
          - runner: macos-14
            asset: macos-arm64
            binary: rust/target/release/ccusage
          - runner: windows-latest
            asset: windows-x64
            binary: rust/target/release/ccusage.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.asset }}

      - name: Build my-ccusage
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export CCUSAGE_VERSION="${GITHUB_REF_NAME#v}"
          else
            upstream="$(node -p 'require("./package.json").version')"
            export CCUSAGE_VERSION="$upstream-my.dev"
          fi
          cargo build --manifest-path rust/Cargo.toml --release --bin ccusage --features fetch-litellm-pricing

      - name: Verify supplemental commands
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          "$BINARY" --version
          "$BINARY" dsh --help
          "$BINARY" workbuddy --help
          test "$("$BINARY" dsh daily --json --offline | python -c 'import json,sys; print(isinstance(json.load(sys.stdin), dict))')" = True

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
        run: |
          package="my-ccusage-$ASSET"
          mkdir -p "$package"
          cp "$BINARY" "$package/my-ccusage"
          chmod +x "$package/my-ccusage"
          printf 'Source: %s\nCommit: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$package/BUILD-INFO.txt"
          tar -czf "$package.tar.gz" "$package"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          BINARY: ${{ matrix.binary }}
        run: |
          $package = "my-ccusage-$env:ASSET"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item $env:BINARY "$package/my-ccusage.exe"
          "Source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY`nCommit: $env:GITHUB_SHA" | Set-Content "$package/BUILD-INFO.txt"
          Compress-Archive -Path $package -DestinationPath "$package.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: my-ccusage-${{ matrix.asset }}
          path: my-ccusage-${{ matrix.asset }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: my-ccusage-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum my-ccusage-*.* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
